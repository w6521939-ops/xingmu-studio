name: 功能建议
description: 提出新功能建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 你遇到了什么问题或不便？
      placeholder: 我在做...时，发现无法...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎样解决？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？

  - type: dropdown
    id: area
    attributes:
      label: 功能域
      options:
        - 剧本创作
        - 角色管理
        - 分镜编排
        - 图片生成
        - 配音生成
        - 视频生成
        - 成片合成
        - 渲染引擎
        - Provider 抽象
        - 管线扩展
        - 其他
    validations:
      required: true
